# Server block for the crisispage container (installed as /etc/nginx/conf.d/default.conf in
# nginxinc/nginx-unprivileged). TLS and HSTS are the job of the reverse proxy / hoster in front.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    autoindex off;
    absolute_redirect off;   # "/de" -> "/de/" without leaking host/port behind a proxy

    # Read-only site: GET and HEAD only.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Security headers (server level only, so no location can silently drop them).
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-cache" always;   # revalidate via ETag: new updates show up at once

    # Never serve hidden files (also hides the build's temp files).
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
