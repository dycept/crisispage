# Serves ./public (as produced by `python3 crisis.py build`) read-only on port 8080.
# New updates: build, then replace the files in ./public (e.g. rsync) - no restart needed.
services:
  crisispage:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    # Bound to localhost: put a TLS-terminating reverse proxy in front, or change to "8080:8080".
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
